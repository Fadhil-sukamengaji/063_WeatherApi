<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Nama : Fadhil Mudzaki</h1>
    <h1>Nim : 20240140063</h1>

    <p>
        Kota :
        <span id="lokasi"></span>
    </p>

    <hr>
    <p>
        Kordinat :
        <span id="negara"></span>
    </p>

    <script>
        fetch("/api/lokasi")
            .then(response => response.json())
            .then(data => {

                console.log(data);

                document.getElementById("lokasi").innerHTML = data.kota;
                document.getElementById("negara").innerHTML = data.koordinat;
            })
            .catch(error => {
                console.error(error);
            });
    </script>
</body>
</html>
